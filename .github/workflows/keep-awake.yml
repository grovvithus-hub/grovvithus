# Pings the live site every 10 minutes so a free Render service does not go to sleep.
# Set it up once: GitHub repo > Settings > Secrets and variables > Actions > Variables tab >
# New repository variable named SITE_URL with your site address, e.g. https://grovvithus.onrender.com
# Without that variable this workflow does nothing.
#
# GitHub may delay scheduled runs and pauses them after 60 days without repository activity.
# For a more reliable ping also use a free external pinger (see docs/RENDER_DEPLOY.md).
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::SITE_URL variable is not set, nothing to ping."
            exit 0
          fi
          # A sleeping Render service can take about a minute to answer, so allow a long wait and one retry.
          curl --silent --show-error --fail --max-time 100 --retry 1 --retry-delay 5 "${SITE_URL%/}/api/health" || echo "::warning::Ping failed (the site may be waking up)."
